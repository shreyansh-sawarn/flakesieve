name: 'flakesieve'
description: 'Know which CI failures are real. Flags known flaky tests on pull requests.'
author: 'flakesieve contributors'

branding:
  icon: 'filter'
  color: 'yellow'

inputs:
  report-paths:
    description: 'Glob(s) for test report files (JUnit XML). Newline- or comma-separated.'
    required: false
    default: '**/junit.xml'
  history-branch:
    description: 'Orphan branch holding the run history.'
    required: false
    default: 'flakesieve-history'
  history-path:
    description: 'Top-level filename for the history within the history branch.'
    required: false
    default: 'history.json'
  comment:
    description: 'Post or update a PR comment with the findings.'
    required: false
    default: 'true'
  record:
    description: >
      Append this run to history. Set true only on the default branch — recording
      PR runs poisons the baseline, teaching flakesieve that a genuinely broken
      test "fails sometimes" and turning real regressions into reported flakes.
    required: false
    default: 'false'
  fail-on-real:
    description: 'Fail the job when an unexplained failure is found. Known flakes never fail it.'
    required: false
    default: 'false'
  token:
    description: 'Token used to post the comment. Needs pull-requests: write.'
    required: false
    default: ${{ github.token }}

outputs:
  likely-real:
    description: 'Count of failures with no history of failing.'
  known-flakes:
    description: 'Count of failures identified as known flakes.'
  already-broken:
    description: 'Count of failures that predate this PR.'
  runs-analyzed:
    description: 'Number of historical runs the verdicts are based on.'

runs:
  using: 'node24'
  main: 'action-dist/index.cjs'
