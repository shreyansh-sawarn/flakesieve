name: CI

on:
  push:
    branches: [main]
  # Runs on PRs from forks too — a contributor whose PR sits without a green
  # check assumes they did something wrong and gives up.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify the CLI actually runs
        run: |
          node scripts/seed-demo.mjs "$RUNNER_TEMP/history.json"
          node dist/cli.js analyze \
            --report "test/fixtures/demo-run.xml" \
            --history "$RUNNER_TEMP/history.json"
